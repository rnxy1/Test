name: Vendor Full Marley Stack

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vendor-marley.yml'

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bundle repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone complete upstream stack
        shell: bash
        run: |
          set -euo pipefail
          rm -rf vendor
          mkdir -p vendor

          git clone --depth 1 --branch version-16 https://github.com/frappe/frappe.git /tmp/frappe
          git clone --depth 1 --branch version-16 https://github.com/frappe/erpnext.git /tmp/erpnext
          git clone --depth 1 --branch version-16 https://github.com/earthians/marley.git /tmp/marley
          git clone --depth 1 --branch develop https://github.com/earthians/marley_frontend.git /tmp/marley_frontend

          FRAPPE_SHA=$(git -C /tmp/frappe rev-parse HEAD)
          ERPNEXT_SHA=$(git -C /tmp/erpnext rev-parse HEAD)
          MARLEY_SHA=$(git -C /tmp/marley rev-parse HEAD)
          FRONTEND_SHA=$(git -C /tmp/marley_frontend rev-parse HEAD)

          rm -rf /tmp/frappe/.git /tmp/erpnext/.git /tmp/marley/.git /tmp/marley_frontend/.git

          cp -a /tmp/frappe vendor/frappe
          cp -a /tmp/erpnext vendor/erpnext
          cp -a /tmp/marley vendor/marley
          cp -a /tmp/marley_frontend vendor/marley_frontend

          cat > UPSTREAM_VERSIONS.md <<EOF
          # Vendored Upstream Versions

          Generated automatically by GitHub Actions.

          - Frappe Framework branch: \`version-16\`
          - Frappe Framework commit: \`${FRAPPE_SHA}\`
          - ERPNext branch: \`version-16\`
          - ERPNext commit: \`${ERPNEXT_SHA}\`
          - Marley Health branch: \`version-16\`
          - Marley Health commit: \`${MARLEY_SHA}\`
          - Marley Frontend branch: \`develop\`
          - Marley Frontend commit: \`${FRONTEND_SHA}\`
          EOF

      - name: Commit vendored sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vendor UPSTREAM_VERSIONS.md
          if git diff --cached --quiet; then
            echo 'No upstream changes to commit.'
            exit 0
          fi
          git commit -m 'Vendor full Frappe ERPNext Marley stack'
          git push
